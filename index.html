<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uma mensagem pra você 💌</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5d9e5;color:#422733}
.site{width:100%;height:100vh;position:relative;overflow:hidden;background:radial-gradient(circle at 20% 15%,#fff 0,rgba(255,255,255,.55) 18%,transparent 40%),linear-gradient(150deg,#fff8fb,#f4d4e1)}
.screen{position:absolute;inset:0;padding:30px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;opacity:0;visibility:hidden;transform:translateX(45px);transition:opacity .7s ease,transform .7s ease,visibility .7s}
.screen.active{opacity:1;visibility:visible;transform:translateX(0)}
.envelope{width:92px;height:72px;margin-bottom:34px;border-radius:12px;background:#e99bb8;display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 15px 35px rgba(150,70,100,.18);animation:float 2.5s ease-in-out infinite}
.small{font-size:12px;letter-spacing:3px;color:#a66b80;margin-bottom:14px}
h1{font-size:clamp(34px,9vw,52px);line-height:1.05;margin-bottom:17px}
.intro p,.final p{max-width:330px;font-size:16px;line-height:1.6;color:#80606c}
button{margin-top:34px;border:0;padding:15px 30px;border-radius:999px;background:#d8799d;color:#fff;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 10px 25px rgba(180,80,120,.25);transition:.2s}
button:hover{transform:translateY(-2px)}
button:active{transform:scale(.94)}
.mini{font-size:13px;letter-spacing:2px;color:#a66b80;margin-bottom:24px}
.typing-box{width:min(350px,90vw);min-height:165px;padding:28px 24px;border-radius:25px;background:rgba(255,255,255,.86);box-shadow:0 15px 40px rgba(100,50,70,.11);display:flex;align-items:center;justify-content:center}
#typingText{font-size:20px;line-height:1.65}
.cursor{display:inline-block;width:2px;height:22px;background:#d8799d;margin-left:3px;vertical-align:middle;animation:blink .8s infinite}
.final-heart{width:108px;height:108px;border-radius:50%;background:#e99bb8;display:flex;align-items:center;justify-content:center;font-size:53px;margin-bottom:30px;box-shadow:0 15px 40px rgba(180,70,110,.25);animation:heartbeat 1.4s infinite}
.final h2{font-size:clamp(36px,10vw,56px);line-height:1.08;margin-bottom:15px}
.final strong{color:#d0648e}
.heart{position:absolute;bottom:-40px;pointer-events:none;color:#e58eaf;animation:rise linear forwards}
@keyframes rise{0%{transform:translateY(0) scale(.7) rotate(0);opacity:0}15%{opacity:1}100%{transform:translateY(-110vh) scale(1.3) rotate(25deg);opacity:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes heartbeat{0%,100%{transform:scale(1)}15%{transform:scale(1.12)}30%{transform:scale(1)}45%{transform:scale(1.08)}}
@keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<main class="site">

<section class="screen intro active" id="screen1">
  <div class="envelope">💌</div>
  <span class="small">UMA MENSAGEM PRA VOCÊ</span>
  <h1>posso te<br>falar uma coisa?</h1>
  <p>eu pensei bastante antes de criar isso...</p>
  <button onclick="nextScreen()">abrir mensagem</button>
</section>

<section class="screen message-screen" id="screen2">
  <span class="mini">ANTES DE VOCÊ IR...</span>
  <div class="typing-box">
    <p id="typingText"></p><span class="cursor"></span>
  </div>
  <button id="continueButton" onclick="nextScreen()" style="display:none">continuar 💗</button>
</section>

<section class="screen final" id="screen3">
  <div class="final-heart">♡</div>
  <h2>me dá uma chance?</h2>
  <p>talvez tudo que eu precisava era<br><strong>ter coragem de te dizer isso.</strong></p>
</section>

</main>

<script>
let currentScreen=1;
const message="Eu não sei exatamente como dizer isso... mas eu queria que você soubesse que existe alguém aqui torcendo para que talvez a gente possa viver alguma coisa juntos. 🤍";
let typingIndex=0;
let heartsStarted=false;

function nextScreen(){
  document.getElementById("screen"+currentScreen).classList.remove("active");
  currentScreen++;
  setTimeout(()=>{
    document.getElementById("screen"+currentScreen).classList.add("active");
    if(currentScreen===2) startTyping();
    if(currentScreen===3) startHearts();
  },250);
}

function startTyping(){
  const text=document.getElementById("typingText");
  const button=document.getElementById("continueButton");
  text.textContent="";
  typingIndex=0;
  function type(){
    if(typingIndex<message.length){
      text.textContent+=message.charAt(typingIndex++);
      setTimeout(type,45);
    }else button.style.display="inline-block";
  }
  type();
}

function createHeart(){
  const heart=document.createElement("div");
  heart.className="heart";
  heart.textContent=Math.random()>.5?"♡":"♥";
  heart.style.left=Math.random()*100+"%";
  heart.style.fontSize=(15+Math.random()*25)+"px";
  heart.style.animationDuration=(3+Math.random()*3)+"s";
  document.querySelector(".site").appendChild(heart);
  setTimeout(()=>heart.remove(),6500);
}

function startHearts(){
  if(heartsStarted)return;
  heartsStarted=true;
  for(let i=0;i<30;i++) setTimeout(createHeart,i*90);
  setInterval(createHeart,500);
}
</script>
</body>
</html>
